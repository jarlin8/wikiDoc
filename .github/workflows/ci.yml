name: CI

# 原先仓库只有 push 触发的部署工作流，没有任何 PR 校验 ——
# Dependabot 的升级 PR 无法自动验证 425 页是否仍能构建通过。
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build check
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build website
        run: yarn build
